apiVersion: apps/v1
kind: Deployment
metadata:
  name: gluco-mlops-api
  labels:
    app: gluco-mlops-api
spec:
  replicas: 2
  selector:
    matchLabels:
      app: gluco-mlops-api
  template:
    metadata:
      labels:
        app: gluco-mlops-api
    spec:
      containers:
        - name: gluco-mlops-api
          image: gluco-mlops-api:latest
          imagePullPolicy: Never
          ports:
            - containerPort: 8000

          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10

          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 15
            periodSeconds: 20

          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
            limits:
              memory: "256Mi"
              cpu: "500m"
