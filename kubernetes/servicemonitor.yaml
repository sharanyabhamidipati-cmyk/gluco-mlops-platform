apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: gluco-mlops-api-monitor
  namespace: monitoring
  labels:
    release: prometheus
spec:
  namespaceSelector:
    matchNames:
      - default

  selector:
    matchLabels:
      app: gluco-mlops-api

  endpoints:
    - port: http
      path: /metrics
      interval: 15s
