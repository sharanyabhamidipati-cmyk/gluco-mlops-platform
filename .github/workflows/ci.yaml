name: CI - Gluco MLOps Platform

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build-and-validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r app/requirements.txt

      - name: Validate Python syntax
        run: |
          python -m compileall app

      - name: Train model for CI build
        run: |
          python app/train.py

      - name: Build Docker image
        run: |
          docker build -t gluco-mlops-api:ci -f docker/Dockerfile .

      - name: Validate Kubernetes manifests
        run: |
          kubectl --dry-run=client --validate=false apply -f kubernetes/deployment.yaml
          kubectl --dry-run=client --validate=false apply -f kubernetes/service.yaml
