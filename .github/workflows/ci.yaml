name: CI - Gluco MLOps Platform

on:
  push:
    branches:
      - main
    paths:
      - 'app/**'
      - 'docker/**'
      - 'kubernetes/**'
      - '.github/workflows/**'
  pull_request:
    branches:
      - main
    paths:
      - 'app/**'
      - 'docker/**'
      - 'kubernetes/**'
      - '.github/workflows/**'

jobs:
  build-and-validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r app/requirements.txt
          pip install pyyaml

      - name: Validate Python syntax
        run: |
          python -m compileall app

      - name: Train model for CI build
        run: |
          python app/train.py

      - name: Build Docker image
        run: |
          docker build -t gluco-mlops-api:ci -f docker/Dockerfile .

      - name: Validate Kubernetes YAML syntax
        run: |
          python - <<'PY'
          import yaml

          files = [
              "kubernetes/deployment.yaml",
              "kubernetes/service.yaml"
          ]

          for file in files:
              with open(file) as f:
                  yaml.safe_load(f)
              print(f"{file} is valid YAML")
          PY
